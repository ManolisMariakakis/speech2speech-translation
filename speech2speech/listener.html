<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Listener - English Translation Audio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f7f7f7;color:#222}
.container{max-width:900px;margin:0 auto}
h2{text-align:center}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:15px}
button,select{padding:12px 16px;font-size:17px}
#status{text-align:center;margin:15px 0;font-size:18px;color:green}
#current{background:white;border:2px solid #ddd;border-radius:10px;min-height:120px;padding:20px;font-size:30px;line-height:1.35;margin-bottom:20px}
#history{background:white;border:1px solid #ccc;border-radius:8px;min-height:180px;padding:15px;font-size:20px;line-height:1.45;white-space:pre-wrap}
.small{font-size:14px;color:#666;text-align:center}
</style>
</head>
<body>
<div class="container">
<h2>English Translation Audio</h2>

<div class="controls">
  <button id="connectBtn">Connect Audio</button>
  <button id="pauseBtn">Pause</button>
  <button id="resumeBtn">Resume</button>
  <button id="stopBtn">Stop Audio</button>
</div>

<div class="controls">
<label>Voice: <select id="voiceSelect"></select></label>
<label>Speed:
<select id="rateSelect">
  <option value="0.85">Slow</option>
  <option value="0.95" selected>Normal</option>
  <option value="1.05">Fast</option>
</select>
</label>
</div>

<div id="status">Idle</div>
<div class="small">Keep this page open. Press “Connect Audio” once to allow browser speech.</div>

<h3>Now speaking</h3>
<div id="current">...</div>

<h3>Transcript</h3>
<div id="history">...</div>
</div>

<script>
let relayWs=null,reconnectTimer=null;
let buffer="",flushTimer=null;
let speakingQueue=[],isSpeaking=false,isPaused=false,connected=false;
let receivedHistory=[],spokenHistory=[],voices=[];

const statusDiv=document.getElementById("status");
const currentDiv=document.getElementById("current");
const historyDiv=document.getElementById("history");
const voiceSelect=document.getElementById("voiceSelect");
const rateSelect=document.getElementById("rateSelect");

document.getElementById("connectBtn").onclick=connect;
document.getElementById("pauseBtn").onclick=pauseAudio;
document.getElementById("resumeBtn").onclick=resumeAudio;
document.getElementById("stopBtn").onclick=stopAudio;

function loadVoices(){
  voices=speechSynthesis.getVoices();
  voiceSelect.innerHTML="";
  const englishVoices=voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith("en"));
  englishVoices.forEach(voice=>{
    const option=document.createElement("option");
    option.value=voices.indexOf(voice);
    option.textContent=`${voice.name} (${voice.lang})`;
    voiceSelect.appendChild(option);
  });
  const preferred=englishVoices.find(v=>/aria|jenny|natural|google|microsoft|english/i.test(v.name));
  if(preferred) voiceSelect.value=voices.indexOf(preferred);
}
speechSynthesis.onvoiceschanged=loadVoices;
loadVoices();

function getRelayUrl(){
  const protocol=location.protocol==="https:"?"wss:":"ws:";
  if(location.hostname.includes(".proxy.runpod.net")){
    const base=location.hostname.replace(/-\d+\.proxy\.runpod\.net$/,"");
    return protocol+"//"+base+"-9001.proxy.runpod.net";
  }
  return protocol+"//"+location.hostname+":9001";
}
function connect(){
  connected=true;
  speechSynthesis.cancel();
  isSpeaking=false; isPaused=false;
  speakingQueue=[]; buffer="";
  receivedHistory=[]; spokenHistory=[];
  currentDiv.innerText="...";
  historyDiv.innerText="...";
  openRelay();
}
function openRelay(){
  clearTimeout(reconnectTimer);
  const relayUrl=getRelayUrl();
  statusDiv.innerText="Connecting to relay...";
  relayWs=new WebSocket(relayUrl);

  relayWs.onopen=()=>{statusDiv.innerText="Connected. Waiting for translation...";};
  relayWs.onmessage=(event)=>{
    let text="";
    try{const data=JSON.parse(event.data); text=data.text||"";}catch{text=String(event.data);}
    text=cleanText(text);
    if(!text||isRepeated(text))return;
    appendHistory(text);
    addToNaturalBuffer(text);
  };
  relayWs.onerror=()=>{statusDiv.innerText="Relay error";};
  relayWs.onclose=()=>{
    statusDiv.innerText="Relay closed";
    if(connected) reconnectTimer=setTimeout(openRelay,1500);
  };
}
function cleanText(text){
  return String(text||"").replace(/\s+/g," ").replace(/\s+([.,!?;:])/g,"$1").trim();
}
function normalizeText(text){
  return cleanText(text).toLowerCase().replace(/[.,!?;:"'()[\]]/g,"").trim();
}
function wordOverlapRatio(a,b){
  const aw=normalizeText(a).split(/\s+/).filter(Boolean);
  const bw=normalizeText(b).split(/\s+/).filter(Boolean);
  if(!aw.length||!bw.length)return 0;
  const setA=new Set(aw);
  let overlap=0;
  for(const w of bw) if(setA.has(w)) overlap++;
  return overlap/Math.min(aw.length,bw.length);
}
function isRepeated(text){
  const n=normalizeText(text);
  if(!n)return true;
  for(const old of receivedHistory){
    const o=normalizeText(old);
    if(n===o)return true;
    if(n.length>25&&o.includes(n))return true;
    if(o.length>25&&n.includes(o))return true;
    if(n.length>40&&o.length>40&&wordOverlapRatio(n,o)>0.84)return true;
  }
  receivedHistory.push(text);
  if(receivedHistory.length>35)receivedHistory.shift();
  return false;
}
function appendHistory(text){
  if(historyDiv.innerText==="...") historyDiv.innerText=text;
  else historyDiv.innerText+="\n"+text;
}
function addToNaturalBuffer(text){
  buffer=cleanText(buffer+(buffer?" ":"")+text);
  const words=buffer.split(/\s+/).filter(Boolean);
  const endsSentence=/[.!?]$/.test(buffer);
  const hasStrongPause=/[,;:]$/.test(buffer);
  const enoughWords=words.length>=14;
  const tooLong=words.length>=24;

  if(endsSentence||tooLong||(hasStrongPause&&enoughWords)){flushBuffer();return;}
  clearTimeout(flushTimer);
  flushTimer=setTimeout(flushBuffer,1500);
}
function flushBuffer(){
  clearTimeout(flushTimer);
  const phrase=cleanText(buffer);
  buffer="";
  if(!phrase)return;
  const normalized=normalizeText(phrase);
  if(spokenHistory.includes(normalized))return;
  spokenHistory.push(normalized);
  if(spokenHistory.length>50)spokenHistory.shift();
  speakingQueue.push(phrase);
  playQueue();
}
function playQueue(){
  if(isPaused||isSpeaking||!speakingQueue.length)return;
  const phrase=speakingQueue.shift();
  isSpeaking=true;
  currentDiv.innerText=phrase;

  const utter=new SpeechSynthesisUtterance(phrase);
  utter.lang="en-US";
  utter.rate=parseFloat(rateSelect.value||"0.95");
  utter.pitch=1;

  const selectedVoiceIndex=parseInt(voiceSelect.value,10);
  if(!Number.isNaN(selectedVoiceIndex)&&voices[selectedVoiceIndex]) utter.voice=voices[selectedVoiceIndex];

  utter.onend=()=>{isSpeaking=false; playQueue();};
  utter.onerror=()=>{isSpeaking=false; playQueue();};
  speechSynthesis.speak(utter);
}
function pauseAudio(){
  isPaused=true;
  speechSynthesis.pause();
  statusDiv.innerText="Paused";
}
function resumeAudio(){
  isPaused=false;
  speechSynthesis.resume();
  statusDiv.innerText="Connected. Waiting for translation...";
  playQueue();
}
function stopAudio(){
  connected=false;
  clearTimeout(reconnectTimer);
  clearTimeout(flushTimer);
  speechSynthesis.cancel();
  speakingQueue=[]; buffer="";
  isSpeaking=false; isPaused=false;
  if(relayWs) relayWs.close();
  statusDiv.innerText="Audio stopped";
}
</script>
</body>
</html>
